name: Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assemble the site — the latest release at the root, main as next/, a folder per release
        run: |
          set -eu
          mkdir -p _site/next
          git archive origin/main | tar -x -C _site/next
          latest=""
          for tag in $(git tag --list 'v*' --sort=v:refname); do
            mkdir -p "_site/${tag#v}"
            git archive "$tag" | tar -x -C "_site/${tag#v}"
            latest="$tag"
          done
          git archive "${latest:-origin/main}" | tar -x -C _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
