name: Pages

on:
  workflow_run:
    workflows: [Probes]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assemble the site — the latest release at the root, main as next/, a folder per release
        run: |
          set -eu
          mkdir -p _site/next
          git archive origin/main | tar -x -C _site/next
          latest=""
          for tag in $(git tag --list 'v*' --sort=v:refname); do
            mkdir -p "_site/${tag#v}"
            git archive "$tag" | tar -x -C "_site/${tag#v}"
            latest="$tag"
          done
          git archive "${latest:-origin/main}" | tar -x -C _site

      - name: Add the sheets of the probes — main's latest as next/checks, each release's own as <version>/checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          run=$(gh run list --workflow probes.yml --branch main --event push --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            gh run download "$run" --name checks --dir _site/next/checks || echo "main's latest probes run has no sheet"
          fi
          for tag in $(git tag --list 'v*' --sort=v:refname); do
            if gh release download "$tag" --pattern checks.zip --dir "/tmp/checks-$tag" 2>/dev/null; then
              mkdir -p "_site/${tag#v}/checks"
              unzip -q "/tmp/checks-$tag/checks.zip" -d "_site/${tag#v}/checks"
            fi
          done
          root=$(git tag --list 'v*' --sort=v:refname | tail -n 1)
          from="_site/next/checks"
          if [ -n "$root" ]; then
            from="_site/${root#v}/checks"
          fi
          if [ -d "$from" ]; then
            cp -R "$from" _site/checks
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
