name: Pages

on:
  workflow_run:
    workflows: [Probes]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assemble the site - the latest release at the root, main as next/, a folder per release
        run: |
          set -eu
          mkdir -p _site/next
          git archive origin/main | tar -x -C _site/next
          latest=""
          for tag in $(git tag --list 'v*' --sort=v:refname); do
            mkdir -p "_site/${tag#v}"
            git archive "$tag" | tar -x -C "_site/${tag#v}"
            latest="$tag"
          done
          git archive "${latest:-origin/main}" | tar -x -C _site

      - name: Add the sheets of the probes - main's latest as next/checks, the latest release's as <version>/checks and checks; an older one stays in its release's checks.zip, as a published site may hold 1 GB
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # The sheet of main's commit: the newest run of that commit with a sheet - a branch's run when main's push
          # found the commit already passed and ran no part.
          sheet=""
          for run in $(gh run list --workflow probes.yml --commit "$(git rev-parse origin/main)" --status completed --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run" --name checks --dir _site/next/checks 2>/dev/null; then
              sheet="$run"
              break
            fi
          done
          if [ -z "$sheet" ]; then
            echo "main's commit has no probes run with a sheet"
          fi
          root=$(git tag --list 'v*' --sort=v:refname | tail -n 1)
          from="_site/next/checks"
          if [ -n "$root" ]; then
            if gh release download "$root" --pattern checks.zip --dir "/tmp/checks-$root" 2>/dev/null; then
              mkdir -p "_site/${root#v}/checks"
              unzip -q "/tmp/checks-$root/checks.zip" -d "_site/${root#v}/checks"
            fi
            from="_site/${root#v}/checks"
          fi
          if [ -d "$from" ]; then
            cp -R "$from" _site/checks
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 1800000
