name: Probe part

# One part of the probes on demand — the engines named, on the macOS image named — for work that only CI can check,
# iterated on a branch before it lands on main: gh workflow run probe-part.yml --ref BRANCH -f engines=voiceover
on:
  workflow_dispatch:
    inputs:
      engines:
        description: The engines, as php tools/probe.php takes them, space-separated
        required: true
      runner:
        description: The macOS image
        default: macos-15

permissions:
  contents: read

jobs:
  part:
    name: probe part (${{ inputs.engines }} on ${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd
          coverage: none
          tools: none

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/redz-ui
          key: probe-part-${{ inputs.runner }}-${{ hashFiles('tools/probes/config.json') }}

      - name: Let safaridriver drive Safari and the simulators
        if: contains(inputs.engines, 'safari') || contains(inputs.engines, 'ios') || contains(inputs.engines, 'voiceover')
        run: sudo safaridriver --enable

      - name: Let AppleScript drive VoiceOver
        if: contains(inputs.engines, 'voiceover')
        run: php tools/probe.php voiceover-setup

      - name: The pages in ${{ inputs.engines }}
        env:
          ENGINES: ${{ inputs.engines }}
        run: php tools/probe.php $ENGINES

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-part
          path: .dev/probes
          if-no-files-found: error
