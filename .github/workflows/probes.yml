name: Probes

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    # macOS 15: its image has the iOS 18.5 and 26.2 simulators, and Firefox 132 starts there — not on macOS 27. Its
    # Chrome lags (152), so the current Chrome is a pinned Chrome for Testing build (chrome-156 in the config).
    # Five parts at once — the most macOS jobs a free account runs together — each its own sheet, joined below.
    name: probes (${{ matrix.part.name }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: chrome, engines: chrome-156}
          - {name: firefox, engines: firefox}
          - {name: safari, engines: safari}
          - {name: floor, engines: chrome-130 firefox-132 chrome-136}
          - {name: ios, engines: ios-18 ios-26}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd
          coverage: none
          tools: none

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/redz-ui
          key: probes-${{ matrix.part.name }}-${{ hashFiles('tools/probes/config.json') }}

      - name: Let safaridriver drive Safari and the simulators
        if: matrix.part.name == 'safari' || matrix.part.name == 'ios'
        run: sudo safaridriver --enable

      - name: The pages in ${{ matrix.part.engines }}
        run: php tools/probe.php ${{ matrix.part.engines }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: part-${{ matrix.part.name }}
          path: .dev/probes
          if-no-files-found: error

  sheet:
    needs: probes
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: One sheet of the five parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh run download "${GITHUB_RUN_ID}" --pattern 'part-*' --dir parts
          php tools/probe.php merge parts/part-chrome parts/part-firefox parts/part-safari parts/part-floor parts/part-ios

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks
          path: .dev/probes
          if-no-files-found: error

  release:
    needs: sheet
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach the sheet of the probes to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh run download "${GITHUB_RUN_ID}" --name checks --dir checks
          (cd checks && zip -qr ../checks.zip .)
          gh release upload "${GITHUB_REF_NAME}" checks.zip --clobber
