name: Probes

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      parts:
        description: 'A lab run of only these parts, by name, space separated (all when empty); its sheet joins them alone'
        type: string
        default: ''
      pages:
        description: 'A lab run of only these pages, comma separated, as php tools/probe.php --pages takes them (all when empty)'
        type: string
        default: ''

permissions:
  contents: read

env:
  # The parts. Chrome and Firefox - the current ones and the floor's - on Linux, each engine its own job: no macOS runner
  # is needed for them, and macOS runners are scarce, five at a time on a free account. The current Chrome is a pinned
  # Chrome for Testing build (chrome-156 in the config). macOS 15 for Safari and for the iOS 18.5 and 26.2 simulators,
  # one job each; VoiceOver on macOS 15, the first with its activedescendant fix, and on macOS 26 - five macOS jobs. NVDA
  # in Chrome and in Firefox on Windows Server 2025, each in two shares of its pages, as a reader waits out its silence
  # after every step; the current Chrome, the longest of the browsers, in two shares too. A part with a "share" K/N runs
  # the K-th of N shares of its engines' pages, split by a hash of each page's name. Each part is its own sheet, joined
  # below.
  ALL: >-
    [{"name": "chrome-1", "engines": "chrome-156", "share": "1/2", "runner": "ubuntu-24.04"},
    {"name": "chrome-2", "engines": "chrome-156", "share": "2/2", "runner": "ubuntu-24.04"},
    {"name": "firefox", "engines": "firefox", "runner": "ubuntu-24.04"},
    {"name": "safari", "engines": "safari"},
    {"name": "floor-chrome-130", "engines": "chrome-130", "runner": "ubuntu-24.04"},
    {"name": "floor-firefox-132", "engines": "firefox-132", "runner": "ubuntu-24.04"},
    {"name": "floor-chrome-136", "engines": "chrome-136", "runner": "ubuntu-24.04"},
    {"name": "ios-18", "engines": "ios-18"},
    {"name": "ios-26", "engines": "ios-26"},
    {"name": "voiceover", "engines": "voiceover"},
    {"name": "voiceover-tahoe", "engines": "voiceover-tahoe", "runner": "macos-26"},
    {"name": "nvda-chrome-1", "engines": "nvda-chrome", "share": "1/2", "runner": "windows-2025"},
    {"name": "nvda-chrome-2", "engines": "nvda-chrome", "share": "2/2", "runner": "windows-2025"},
    {"name": "nvda-firefox-1", "engines": "nvda-firefox", "share": "1/2", "runner": "windows-2025"},
    {"name": "nvda-firefox-2", "engines": "nvda-firefox", "share": "2/2", "runner": "windows-2025"}]

jobs:
  plan:
    # Each part stands on its own: on the nearest commit - this one, then its first parents - where a run left it clean
    # (its artifact "standing" names the part and the run holding its sheet). `php tools/probe.php plan` runs a part
    # again only on what the files changed since then ask of it - every page, the pages they reach (merged into the
    # sheet it stands on), or none (texts, skills, the build tools, another engine's probe code). A manual run with no
    # input plans the same way; one naming parts or pages is a lab run, which never counts as passed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      parts: ${{ steps.plan.outputs.parts }}
      standing: ${{ steps.plan.outputs.standing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANTED: ${{ inputs.parts }}
          PAGES: ${{ inputs.pages }}
        run: php tools/probe.php plan

  probes:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    name: probes (${{ matrix.part.name }})
    runs-on: ${{ matrix.part.runner || 'macos-15' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd, zip, curl, mbstring, openssl
          coverage: none
          tools: none

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/redz-ui' || '~/Library/Caches/redz-ui' }}
          key: probes-${{ matrix.part.name }}-${{ hashFiles('tools/probes/config.json') }}
          restore-keys: probes-${{ matrix.part.name }}-

      - name: Noto on Linux, the fonts Android and ChromeOS draw Arabic and the rest in
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q --no-install-recommends fonts-noto-core

      - name: Let safaridriver drive Safari and the simulators
        if: matrix.part.name == 'safari' || startsWith(matrix.part.name, 'ios') || startsWith(matrix.part.name, 'voiceover')
        run: sudo safaridriver --enable

      - name: Let AppleScript drive VoiceOver
        if: startsWith(matrix.part.name, 'voiceover')
        run: php tools/probe.php voiceover-setup

      - name: Let the windows NVDA reads come in front
        if: startsWith(matrix.part.name, 'nvda')
        run: php tools/probe.php nvda-setup

      - name: The pages in ${{ matrix.part.engines }}
        shell: bash
        env:
          ENGINES: ${{ matrix.part.engines }}
          PAGES: ${{ matrix.part.pages }}
          SHARE: ${{ matrix.part.share }}
        run: php tools/probe.php ${SHARE:+"--share=$SHARE"} ${PAGES:+"--pages=$PAGES"} $ENGINES

      - name: The part's whole sheet - the sheet it stands on, the pages checked again in place
        if: always() && matrix.part.base_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_RUN: ${{ matrix.part.base_run }}
          NAME: ${{ matrix.part.name }}
        run: |
          set -eu
          gh run download "$BASE_RUN" --name "part-$NAME" --dir .dev/base
          mv .dev/probes .dev/fresh
          php tools/probe.php merge --base=.dev/base .dev/fresh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: part-${{ matrix.part.name }}
          path: .dev/probes
          if-no-files-found: error
          overwrite: true

  sheet:
    needs: [plan, probes]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: One sheet of every part - each from the run that checked it last - and the parts that stand on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.plan.outputs.mode }}
          RAN: ${{ needs.plan.outputs.parts }}
          STANDING: ${{ needs.plan.outputs.standing }}
        run: php tools/probe.php gather

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.plan.outputs.mode != 'lab' && hashFiles('.dev/standing/standing.json') != ''
        with:
          name: standing
          path: .dev/standing
          overwrite: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && hashFiles('.dev/verified/verified.json') != ''
        with:
          name: verified
          path: .dev/verified
          overwrite: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks
          path: .dev/probes
          if-no-files-found: error
          overwrite: true

  release:
    # A tag v* becomes a release only when every part of the probes is clean: a draft with the archive and the sheet,
    # then published - the repository's immutable releases lock the tag and the files and sign an attestation of them.
    needs: [plan, probes, sheet]
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.sheet.result == 'success' && (needs.probes.result == 'success' || needs.probes.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: The passport is current, the tag names its version, and the archive and the notes are written
        run: |
          set -eu
          php tools/build.php --check
          php tools/release.php "${GITHUB_REF_NAME}" release

      - name: The release - a draft with the archive, the tools and the sheet of the probes, then published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          gh run download "${GITHUB_RUN_ID}" --name checks --dir checks
          (cd checks && zip -qr ../release/checks.zip .)
          files=("release/redz-ui-${version}.zip")
          if [ -f "release/redz-ui-tools-${version}.zip" ]; then files+=("release/redz-ui-tools-${version}.zip"); fi
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "REDZ.UI ${version}" --notes-file release/notes.md "${files[@]}" release/checks.zip
          gh release edit "${GITHUB_REF_NAME}" --draft=false
