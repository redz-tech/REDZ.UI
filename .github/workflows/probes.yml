name: Probes

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      parts:
        description: 'A lab run of only these parts, by name, space separated (all when empty); its sheet joins them alone'
        type: string
        default: ''
      pages:
        description: 'A lab run of only these pages, comma separated, as php tools/probe.php --pages takes them (all when empty)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    # macOS 15: its image has the iOS 18.5 and 26.2 simulators, and Firefox 132 starts there - not on macOS 27. Its
    # Chrome lags (152), so the current Chrome is a pinned Chrome for Testing build (chrome-156 in the config).
    # Seven macOS parts, five at a time - the most macOS jobs a free account runs together - and two Windows parts beside
    # them, each its own sheet, joined below; VoiceOver on macOS 15, the first with its activedescendant fix, and on macOS
    # 26; NVDA in Chrome and in Firefox on Windows Server 2025.
    # A push, a pull request and a tag run only what changed since the nearest commit that passed (every part, or what
    # changed on top of a commit that passed - its run left the artifact "verified"): `php tools/probe.php affected`
    # says the mode - "full", "pages" (the parts whose engines run a changed page, those pages only) or "none" (the probes
    # read none of it: texts, skills, the build tools; their own checks run in Check) - and the sheet is the base's with
    # the pages checked again in place. A manual run with no input runs everything; one naming parts or pages is a lab
    # run, which never counts as passed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      parts: ${{ steps.plan.outputs.parts }}
      dirs: ${{ steps.plan.outputs.dirs }}
      pages: ${{ steps.plan.outputs.pages }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANTED: ${{ inputs.parts }}
          PAGES: ${{ inputs.pages }}
          ALL: >-
            [{"name": "chrome", "engines": "chrome-156"},
            {"name": "firefox", "engines": "firefox"},
            {"name": "safari", "engines": "safari"},
            {"name": "floor", "engines": "chrome-130 firefox-132 chrome-136"},
            {"name": "ios", "engines": "ios-18 ios-26"},
            {"name": "voiceover", "engines": "voiceover"},
            {"name": "voiceover-tahoe", "engines": "voiceover-tahoe", "runner": "macos-26"},
            {"name": "nvda-chrome", "engines": "nvda-chrome", "runner": "windows-2025"},
            {"name": "nvda-firefox", "engines": "nvda-firefox", "runner": "windows-2025"}]
        run: |
          set -eu
          want=$(jq -c '[.[] | "probes (" + .name + ")"]' <<< "$ALL")
          # The run that passed commit $1: it left the artifact "verified", or every part of it passed; '' when none did.
          passed() {
            for id in $(gh run list --workflow probes.yml --commit "$1" --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
              if gh api "repos/${GH_REPO}/actions/runs/${id}/artifacts" --jq '.artifacts[].name' | grep -qx verified; then
                echo "$id"
                return
              fi
              if gh run view "$id" --json jobs --jq '[.jobs[] | select(.conclusion == "success") | .name]' | jq -e --argjson want "$want" '. as $have | ($want - $have) == []' > /dev/null; then
                echo "$id"
                return
              fi
            done
          }
          mode=full
          parts="$ALL"
          pages=""
          base=""
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            if [ -n "${WANTED:-}" ] || [ -n "${PAGES:-}" ]; then
              mode=lab
              pages="${PAGES:-}"
              parts=$(jq -c --arg wanted "${WANTED:-}" '($wanted | split(" ") | map(select(. != ""))) as $w | map(select($w == [] or (.name as $n | any($w[]; . == $n))))' <<< "$ALL")
              if [ "$(jq length <<< "$parts")" -eq 0 ]; then
                echo "no part is named ${WANTED}" >&2
                exit 1
              fi
            fi
          else
            base=$(passed "${GITHUB_SHA}")
            if [ -n "$base" ]; then
              mode=none
              echo "${GITHUB_SHA} passed in run ${base}: no part runs again." >> "$GITHUB_STEP_SUMMARY"
            else
              for sha in $(git rev-list --first-parent --max-count=30 HEAD^ 2> /dev/null || true); do
                base=$(passed "$sha")
                if [ -n "$base" ]; then
                  sel=$(php tools/probe.php affected "$sha")
                  mode=$(jq -r .mode <<< "$sel")
                  parts=$(jq -c .parts <<< "$sel")
                  pages=$(jq -r '.pages | join(",")' <<< "$sel")
                  {
                    echo "On top of ${sha} (run ${base}): mode ${mode}, parts $(jq -r '[.[].name] | join(", ")' <<< "$parts"), pages ${pages:-all}."
                    echo
                    jq -r '.files | to_entries[] | "- `" + .key + "`: " + (if .value == "" then "the probes read none of it" elif .value == "*" then "every page" else .value end)' <<< "$sel"
                  } >> "$GITHUB_STEP_SUMMARY"
                  break
                fi
              done
              if [ "$mode" = full ]; then
                base=""
              fi
            fi
          fi
          dirs=$(jq -r 'map("parts/part-" + .name) | join(" ")' <<< "$parts")
          if [ "$mode" = none ]; then
            # No part runs; the matrix still gets a list, as GitHub reads it before the job's condition.
            parts="$ALL"
            dirs=""
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "parts=${parts}" >> "$GITHUB_OUTPUT"
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "pages=${pages}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

  probes:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    name: probes (${{ matrix.part.name }})
    runs-on: ${{ matrix.part.runner || 'macos-15' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd, zip, curl, mbstring, openssl
          coverage: none
          tools: none

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/redz-ui' || '~/Library/Caches/redz-ui' }}
          key: probes-${{ matrix.part.name }}-${{ hashFiles('tools/probes/config.json') }}
          restore-keys: probes-${{ matrix.part.name }}-

      - name: Let safaridriver drive Safari and the simulators
        if: matrix.part.name == 'safari' || matrix.part.name == 'ios' || startsWith(matrix.part.name, 'voiceover')
        run: sudo safaridriver --enable

      - name: Let AppleScript drive VoiceOver
        if: startsWith(matrix.part.name, 'voiceover')
        run: php tools/probe.php voiceover-setup

      - name: Let the windows NVDA reads come in front
        if: startsWith(matrix.part.name, 'nvda')
        run: php tools/probe.php nvda-setup

      - name: The pages in ${{ matrix.part.engines }}
        shell: bash
        env:
          ENGINES: ${{ matrix.part.engines }}
          PAGES: ${{ needs.plan.outputs.pages }}
        run: php tools/probe.php ${PAGES:+"--pages=$PAGES"} $ENGINES

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: part-${{ matrix.part.name }}
          path: .dev/probes
          if-no-files-found: error

  sheet:
    needs: [plan, probes]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: One sheet of the parts, on the base's when the run checked only what changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIRS: ${{ needs.plan.outputs.dirs }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -eu
          if [ -n "$DIRS" ]; then
            gh run download "${GITHUB_RUN_ID}" --pattern 'part-*' --dir parts
          fi
          if [ -n "$BASE" ]; then
            gh run download "$BASE" --name checks --dir base
          fi
          php tools/probe.php merge ${BASE:+--base=base} ${DIRS}

      - name: Mark the commit passed, for the next run's plan
        if: success() && needs.plan.outputs.mode != 'lab' && (needs.probes.result == 'success' || needs.probes.result == 'skipped')
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -eu
          mkdir -p verified
          printf '{"commit": "%s", "mode": "%s", "base_run": "%s"}\n' "${GITHUB_SHA}" "$MODE" "$BASE" > verified/verified.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && needs.plan.outputs.mode != 'lab' && (needs.probes.result == 'success' || needs.probes.result == 'skipped')
        with:
          name: verified
          path: verified

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks
          path: .dev/probes
          if-no-files-found: error

  release:
    # A tag v* becomes a release only when every part of the probes is clean: a draft with the archive and the sheet,
    # then published - the repository's immutable releases lock the tag and the files and sign an attestation of them.
    needs: [plan, probes, sheet]
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.sheet.result == 'success' && (needs.probes.result == 'success' || needs.probes.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: The passport is current, the tag names its version, and the archive and the notes are written
        run: |
          set -eu
          php tools/build.php --check
          php tools/release.php "${GITHUB_REF_NAME}" release

      - name: The release - a draft with the archive and the sheet of the probes, then published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          gh run download "${GITHUB_RUN_ID}" --name checks --dir checks
          (cd checks && zip -qr ../release/checks.zip .)
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "REDZ.UI ${version}" --notes-file release/notes.md "release/redz-ui-${version}.zip" release/checks.zip
          gh release edit "${GITHUB_REF_NAME}" --draft=false
