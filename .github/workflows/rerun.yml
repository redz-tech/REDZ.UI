name: Rerun

# A probes run whose job GitHub never placed on a runner - cancelled before its first step, as macOS 26 arm64 jobs are
# when the runners are short ("not acquired by Runner of type hosted") - runs its failed jobs once more by itself. A
# run that failed on a finding is left as it is, and a second attempt is never rerun.
on:
  workflow_run:
    workflows: [Probes]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the jobs no runner took
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          lost=$(gh run view "$RUN" --json jobs --jq '[.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0) | .name] | join(", ")')
          if [ -z "$lost" ]; then
            echo "run ${RUN} failed on its own findings: nothing to rerun"
            exit 0
          fi
          echo "run ${RUN}: no runner took ${lost}; its failed jobs run once more"
          gh run rerun "$RUN" --failed
